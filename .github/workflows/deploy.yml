name: Build, Push & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - '*.md'

env:
  PROJECT_NAME: worker-golang
  REGISTRY_PROJECT: botspace

permissions:
  contents: write

jobs:
  build-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test + build)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.PROJECT_NAME }}:test

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag & push image
        run: |
          IMAGE_BASE=${{ vars.DOCKER_REGISTRY }}/${{ env.REGISTRY_PROJECT }}/${{ env.PROJECT_NAME }}
          docker tag ${{ env.PROJECT_NAME }}:test "$IMAGE_BASE:${{ env.SHORT_SHA }}"
          docker tag ${{ env.PROJECT_NAME }}:test "$IMAGE_BASE:latest"
          docker push "$IMAGE_BASE:${{ env.SHORT_SHA }}"
          docker push "$IMAGE_BASE:latest"

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ env.SHORT_SHA }}\"|" helm/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git diff --cached --quiet || git commit -m "deploy: update image tag to ${{ env.SHORT_SHA }}"
          git push origin main
